[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilingualpython"
version = "0.1.0"
description = "Python mit fremdsprachigen Schlüsselwörtern (Deutsch, Latein, ...), kompatibel mit dem normalen Python-Ökosystem."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PSF-2.0" }

[project.scripts]
dpy = "bilingualpython.cli:dpy"
lpy = "bilingualpython.cli:lpy"

[tool.setuptools.packages.find]
where = ["src"]
