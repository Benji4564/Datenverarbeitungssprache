[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deutschpython"
version = "0.1.0"
description = "Python mit deutschen Schlüsselwörtern, kompatibel mit dem normalen Python-Ökosystem."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PSF-2.0" }

[project.scripts]
dpy = "deutschpython.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
